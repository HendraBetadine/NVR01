name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Uji klien Let's Encrypt (ACME) terhadap Pebble, server uji resmi Let's Encrypt.
  acme-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Jalankan Pebble
        run: |
          git clone --depth 1 https://github.com/letsencrypt/pebble.git /tmp/pebble
          cd /tmp/pebble
          go build -o /tmp/pebble-bin ./cmd/pebble
          go build -o /tmp/challtestsrv ./cmd/pebble-challtestsrv
          # DNS uji: semua domain -> 127.0.0.1 (port 5002 dipakai klien kita, bukan challtestsrv)
          /tmp/challtestsrv -defaultIPv4 127.0.0.1 -defaultIPv6 "" -http01 "" -https01 "" -tlsalpn01 "" > /tmp/challtestsrv.log 2>&1 &
          PEBBLE_VA_NOSLEEP=1 /tmp/pebble-bin -config test/config/pebble-config.json -dnsserver 127.0.0.1:8053 > /tmp/pebble.log 2>&1 &
          sleep 5
          cat /tmp/pebble.log
      - name: Uji klien ACME
        run: |
          mkdir -p /tmp/out
          javac -d /tmp/out app/src/main/java/id/nvr/stb/Acme.java app/src/main/java/id/nvr/stb/Json.java ci/AcmeIT.java
          java -cp /tmp/out id.nvr.stb.AcmeIT /tmp/pebble/test/certs/pebble.minica.pem
      - name: Log Pebble (jika gagal)
        if: failure()
        run: tail -50 /tmp/pebble.log; tail -20 /tmp/challtestsrv.log

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK r25c (masih support Android 4.4)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/armeabi-v7a/libffmpeg.so
          key: ffmpeg-n7.1-armv7-api19-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg (ARMv7, API 19)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build-ffmpeg.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Siapkan kunci tanda tangan (dari secret KEYSTORE_BASE64)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stbnvr.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/stbnvr.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi - APK memakai kunci debug acak (update harus uninstall)."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk STBNVR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: STBNVR-apk
          path: STBNVR.apk

      # APK langsung bisa diunduh di:
      # https://github.com/<owner>/<repo>/releases/latest/download/STBNVR.apk
      - name: Terbitkan ke GitHub Releases
        if: env.SIGNED == '1' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: STB NVR 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: STBNVR.apk
          make_latest: true
